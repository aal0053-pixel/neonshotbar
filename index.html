    2. Navigation

<!-- Navigation -->
<nav class="fixed top-0 w-full z-50 px-8 py-6 flex justify-between items-center glass-nav">
    <div class="text-3xl font-display tracking-tighter neon-text">HASSAN RESTAUBAR</div>
    <div class="hidden md:flex gap-10 text-[10px] uppercase tracking-[0.4em] font-semibold">
        <a href="#home" class="hover:text-green-400 transition-colors">Home</a>
        <a href="#atmosphere" class="hover:text-green-400 transition-colors">Atmosphere</a>
        <a href="#tables" class="hover:text-green-400 transition-colors">Games</a>

3. Hero Section

<!-- Hero Section -->
<section id="home" class="relative h-screen flex items-center justify-center overflow-hidden">
    <img src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&q=80&w=2070" class="absolute inset-0 w-full h-full object-cover opacity-40">
    <div class="absolute inset-0 hero-gradient"></div>
    <div class="relative z-10 text-center px-4">
        <h1 class="text-[18vw] md:text-[12vw] font-display leading-[0.8] uppercase tracking-tighter mb-6">
            Hassan <br><span class="neon-text animate-neon">Restaubar</span>
        </h1>
        <div class="flex flex-col md:flex-row items-center justify-center gap-6 md:gap-12 mt-12">
            <div class="flex items-center gap-3 text-xs uppercase tracking-widest text-white/60">
                <i data-lucide="map-pin" size="14" class="text-green-400"></i> Downtown, Neon District

            <div class="flex items-center gap-3 text-xs uppercase tracking-widest text-white/60">
                <i data-lucide="clock" size="14" class="text-green-400"></i> Open Daily 6PM - 2AM

        </div>
    </div>
