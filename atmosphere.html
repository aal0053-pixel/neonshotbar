<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere | Neon Restaubar</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <nav class="fixed top-0 w-full z-50 px-8 py-6 flex justify-between items-center glass-nav">
        <div class="text-3xl font-display neon-text">Neon RESTAUBAR</div>

        <div class="hidden md:flex gap-10 text-xs uppercase tracking-widest">
            <a href="index.html">Home</a>
            <a href="atmosphere.html">Atmosphere</a>
            <a href="games.html">Games</a>
            <a href="menu.html">Menu</a>
            <button onclick="openModal('General')" class="neon-border px-6 py-2 rounded-full">
                Book Now
            </button>
        </div>
    </nav>

    <section class="py-32 px-8 text-center">
        <h2 class="text-5xl md:text-7xl font-display uppercase">Atmosphere</h2>
        <p class="mt-6 text-white/60 max-w-2xl mx-auto">
            Step into a neon world full of vibes, lights, and an energetic atmosphere.
        </p>
    </section>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 px-8 pb-20">
        <div class="h-[400px] rounded-3xl overflow-hidden neon-border">
            <img src="https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&q=80&w=2157"
                class="w-full h-full object-cover">
        </div>
        <div class="h-[400px] rounded-3xl overflow-hidden neon-border">
            <img src="https://images.unsplash.com/photo-1534158914592-062992fbe900?auto=format&fit=crop&q=80&w=2099"
                class="w-full h-full object-cover">
        </div>
        <div class="h-[400px] rounded-3xl overflow-hidden neon-border">
            <img src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&q=80&w=2070"
                class="w-full h-full object-cover">
        </div>
    </div>

    <div id="reservationModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center">
        <div class="bg-zinc-900 p-10 rounded-3xl text-center">
            <h2 class="text-3xl font-display">Reserve <span id="modalTitle"></span></h2>
            <button onclick="closeModal()" class="mt-6 neon-border px-6 py-2">Close</button>
        </div>
    </div>

    <footer class="py-20 text-center border-t border-white/10">
        <p>© Neon Restaubar</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
